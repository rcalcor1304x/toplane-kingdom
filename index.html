<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis 13 Campeones LoL</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e1e;
      color: #e0e0e0;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      padding: 20px;
      background-color: #111;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
      color: #ffcc00;
    }
    .champion-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 20px;
    }
    .champion-card {
      width: 100px;
      cursor: pointer;
    }
    .champion-card img {
      width: 100%;
      border-radius: 10px;
      border: 2px solid #444;
      transition: border 0.3s;
    }
    .champion-card img:hover {
      border: 2px solid #ffcc00;
    }
    #details {
      padding: 20px;
      margin-top: 20px;
      background-color: #222;
      border-top: 1px solid #444;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mis Campeones de League of Legends</h1>
  </header>

  <section class="champion-container">
    <!-- Lista de campeones -->
    <div class="champion-card" onclick="showDetails('Ambessa')">
      <img src="https://ddragon.leagueoflegends.com/cdn/16.1.1/img/champion/Ambessa.png" alt="Ambessa">
      <p>Ambessa</p>
    </div>
<div class="champion-card" onclick="showDetails('Sion')">
  <img src="https://ddragon.leagueoflegends.com/cdn/16.1.1/img/champion/Sion.png" alt="Sion">
  <p>Sion</p>
</div>
    <div class="champion-card" onclick="showDetails('Renekton')">
      <img src="https://ddragon.leagueoflegends.com/cdn/16.1.1/img/champion/Renekton.png" alt="Renekton">
      <p>Renekton</p>
    </div>
    <div class="champion-card" onclick="showDetails('Kennen')">
      <img src="https://ddragon.leagueoflegends.com/cdn/16.1.1/img/champion/Kennen.png" alt="Kennen">
      <p>Kennen</p>
    </div>
    <div class="champion-card" onclick="showDetails('Rumble')">
      <img src="https://ddragon.leagueoflegends.com/cdn/16.1.1/img/champion/Rumble.png" alt="Rumble">
      <p>Rumble</p>
    </div>
    <div class="champion-card" onclick="showDetails('Zaahen')">
      <img src="https://ddragon.leagueoflegends.com/cdn/16.1.1/img/champion/Zaahen.png" alt="Zaahen">
      <p>Zaahen</p>
    </div>
    <div class="champion-card" onclick="showDetails('Ksante')">
      <img src="https://ddragon.leagueoflegends.com/cdn/16.1.1/img/champion/KSante.png" alt="Ksante">
      <p>Ksante</p>
    </div>
    <div class="champion-card" onclick="showDetails('Aatrox')">
      <img src="https://ddragon.leagueoflegends.com/cdn/16.1.1/img/champion/Aatrox.png" alt="Aatrox">
      <p>Aatrox</p>
    </div>
    <div class="champion-card" onclick="showDetails('Gwen')">
      <img src="https://ddragon.leagueoflegends.com/cdn/16.1.1/img/champion/Gwen.png" alt="Gwen">
      <p>Gwen</p>
    </div>
    <div class="champion-card" onclick="showDetails('Gnar')">
      <img src="https://ddragon.leagueoflegends.com/cdn/16.1.1/img/champion/Gnar.png" alt="Gnar">
      <p>Gnar</p>
    </div>
    <div class="champion-card" onclick="showDetails('Shen')">
      <img src="https://ddragon.leagueoflegends.com/cdn/16.1.1/img/champion/Shen.png" alt="Shen">
      <p>Shen</p>
    </div>
    <div class="champion-card" onclick="showDetails('Urgot')">
      <img src="https://ddragon.leagueoflegends.com/cdn/16.1.1/img/champion/Urgot.png" alt="Urgot">
      <p>Urgot</p>
    </div>
  </section>

  <section id="details">
    <h2 id="champ-name">Selecciona un campeón</h2>
    <p id="champ-builds">Aquí aparecerán las builds recomendadas.</p>
    <p id="champ-matchups">Aquí aparecerán los mejores matchups y peores matchups según winrate.</p>
    <p id="champ-winrate">Winrate general: --%</p>
  </section>

  <script>
    const champData = {
      Ambessa: {
        builds: "Builds de ejemplo: Fuerza de trinidad, Steraks, etc.",
        matchups: "Fuerte contra X, débil contra Y.",
        winrate: "49.3%"
      },
      Sion: {
        builds: "Builds: Coraza del muerto, Placa del muerto, etc.",
        matchups: "Fuerte contra tanques lentos, débil contra asesinos.",
        winrate: "51.2%"
      },
      Renekton: {
        builds: "Sterak, Corte de Youmuu, etc.",
        matchups: "Fuerte contra luchadores, débil contra control de masas.",
        winrate: "52.8%"
      },
      // Añade el resto de campeones aquí
      Kennen: { builds: "...", matchups: "...", winrate: "50.5%" },
      Rumble: { builds: "...", matchups: "...", winrate: "48.7%" },
      Zaahen: { builds: "...", matchups: "...", winrate: "47.0%" },
      Ksante: { builds: "...", matchups: "...", winrate: "50.0%" },
      Aatrox: { builds: "...", matchups: "...", winrate: "51.5%" },
      Gwen: { builds: "...", matchups: "...", winrate: "49.8%" },
      Gnar: { builds: "...", matchups: "...", winrate: "50.1%" },
      Shen: { builds: "...", matchups: "...", winrate: "50.3%" },
      Urgot: { builds: "...", matchups: "...", winrate: "49.6%" }
    };

    function showDetails(champ) {
      document.getElementById('champ-name').textContent = champ;
      document.getElementById('champ-builds').textContent = "Builds recomendadas: " + champData[champ].builds;
      document.getElementById('champ-matchups').textContent = "Matchups: " + champData[champ].matchups;
      document.getElementById('champ-winrate').textContent = "Winrate: " + champData[champ].winrate;
    }
  </script>

</body>
</html>
